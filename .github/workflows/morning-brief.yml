name: Memeburn morning brief

on:
  schedule:
    - cron: "0 0 * * *"          # 07:00 GMT+7 every day — 1h before the writers' 08:00 GMT+7 workday start (GitHub cron is UTC and can lag a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, don't post to Slack"
        type: boolean
        default: false

permissions:
  contents: write                # to commit briefs/history back for the feedback loop

concurrency: morning-brief

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Crawl and prepare candidates
        run: |
          python scripts/crawl_trends.py
          python scripts/fetch_memeburn.py --days 7
          python scripts/track_outcomes.py
          python scripts/build_candidates.py

      - name: Claude editorial pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/morning-brief --no-crawl --dry-run" \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(python:*)" \
            --max-turns 40

      - name: Post to Slack
        if: ${{ !inputs.dry_run }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/post_slack.py

      - name: Save history
        if: always()
        run: |
          git config user.name "memeburn-topic-scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefs data/candidates data/history knowledge/stats.json 2>/dev/null || true
          git commit -m "brief: $(TZ=Africa/Johannesburg date +%F)" || echo "nothing to commit"
          git push || echo "push failed (non-fatal)"
